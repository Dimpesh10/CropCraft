      display: none;
    }

      padding: 4px 6px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item:hover {
      backgr ound: #2a2a4e;
    }

      padding: 14px;

    }

    #info-content {
      font-size: 13px;
      color: #ccc;

    #info-content .field {
      margin-bottom: 5px;

    #info-content .field b {
      color: #e0e0e0;
    }

    #info-content .empty {
      color: #555;
      font-style: italic;
    }

      display: block;
      padding: 2px 6px;
      margin: 2px 0;
      border-radius: 3px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-left: 3px solid #333;
    }

    .neighbor-link:hover {

    }

    }

    #legend-wrap h3 {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 0;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
    }

    .legend-item:hover {
      background: #2a2a4e;
      padding-left: 4px;
    }

    .legend-item.dimmed {
      opacity: 0.35;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;

    }

    .legend-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .legend-count {
      color: #666;
      font-size: 11px;
    }

    #stats {

dence_score": 0.9, "source_file": "client/src/game/systems/SdgManager.ts" }];
    // afterDrawing passes ctx already transformed to network coordinate space.
    // Draw node positions raw — no manual pan/zoom/DPR math needed.
    network.on('afterDrawing', function (ctx) {
      hyperedges.forEach(h => {
        const positions = h.nodes
          .map(nid => network.getPositions([nid])[nid])
          .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
          x: cx + (p.x - cx) * 1.15,
          y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
